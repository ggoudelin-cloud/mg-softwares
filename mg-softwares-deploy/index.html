  <!-- ─── FONTS ─── -->

  <!-- ─── STYLES ─── -->
  <style>
    :root {
      --bg: #0a0a0f;
      --bg2: #13101e;
      --bg3: #1a1628;
      --salmon: #d4877e;
      --salmon2: #e8b0a5;
      --salmonl: rgba(212, 135, 126, 0.12);
      --navy: #1e1e38;
      --navyl: rgba(30, 30, 56, 0.6);
      --ac: var(--salmon);
      --acg: linear-gradient(135deg, #d4877e 0%, #e8957e 50%, #c86090 100%);
      --ok: #22c880;
      --wn: #f5a623;
      --er: #f04f55;
      --pu: #a07af5;
      --tx: #f0edf5;
      --tx2: #9890aa;
      --tx3: #4a4060;
      --bd: rgba(255, 255, 255, 0.07);
      --gl: rgba(255, 255, 255, 0.04);
      --r: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--tx);
      overflow-x: hidden;
      line-height: 1.6;
    }

    h1, h2, h3 {
      font-family: 'Syne', sans-serif;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 45% at 15% -5%, rgba(212, 135, 126, 0.18), transparent),
                  radial-gradient(ellipse 55% 40% at 88% 108%, rgba(160, 122, 245, 0.12), transparent);
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(10, 10, 15, 0.88);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--bd);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-logo-split {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.5px;
      display: flex;
      align-items: baseline;
      gap: 0;
    }

    .nav-logo-g {
      color: var(--tx);
    }

    .nav-logo-iz {
      color: var(--salmon);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a {
      color: var(--tx2);
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--tx);
    }

    .nav-cta {
      padding: 9px 18px;
      background: var(--acg);
      color: #fff;
      border-radius: 40px;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(212, 135, 126, 0.3);
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
      border: none;
    }

    .nav-cta:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* PAGE CONTAINER */
    #app {
      position: relative;
      z-index: 1;
    }

    .page-content {
      min-height: 100vh;
      padding-top: 80px;
    }

    /* HOME PAGE */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 40px 80px;
      text-align: center;
      gap: 28px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(212, 135, 126, 0.1);
      border: 1px solid rgba(212, 135, 126, 0.25);
      border-radius: 40px;
      font-size: 0.73rem;
      font-weight: 600;
      color: var(--salmon2);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: clamp(2rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      max-width: 100%;
      overflow-wrap: break-word;
    }

    .hero-title .grad {
      background: var(--acg);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      color: var(--tx2);
      max-width: 520px;
      font-weight: 300;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 30px;
      background: var(--acg);
      color: #fff;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(212, 135, 126, 0.4);
      transition: all 0.2s;
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(212, 135, 126, 0.5);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 30px;
      background: var(--gl);
      border: 1px solid var(--bd);
      color: var(--tx);
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    /* LEGAL PAGES */
    .legal-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 80px 40px;
    }

    .legal-content h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
    }

    .legal-content h2 {
      font-size: 1.5rem;
      margin-top: 40px;
      margin-bottom: 20px;
      color: var(--salmon);
    }

    .legal-content p {
      margin-bottom: 16px;
      color: var(--tx2);
      line-height: 1.8;
    }

    .legal-content ul, .legal-content ol {
      margin-left: 20px;
      margin-bottom: 16px;
      color: var(--tx2);
    }

    .legal-content li {
      margin-bottom: 8px;
      line-height: 1.6;
    }

    /* LOADING STATE */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 1.2rem;
      color: var(--tx2);
    }

    /* 404 PAGE */
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px;
      text-align: center;
      gap: 20px;
    }

    .not-found h1 {
      font-size: 4rem;
      color: var(--salmon);
    }

    .not-found p {
      color: var(--tx2);
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      nav {
        padding: 14px 20px;
      }

      .nav-links {
        gap: 16px;
      }

      .hero {
        padding: 100px 20px 60px;
      }

      .legal-content {
        padding: 60px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- NAVIGATION -->
  <nav>
    <a class="nav-logo" onclick="app.navigate('')">
      <div class="nav-logo-split">
        <span class="nav-logo-g">MG</span>
        <span class="nav-logo-iz">Softwares</span>
      </div>
    </a>
    <div class="nav-links">
      <a onclick="app.navigate('gamiz')">Gamiz</a>
      <a onclick="app.navigate('autozen')">AutoZen</a>
      <a onclick="app.navigate('privacy')">Confidentialité</a>
      <button class="nav-cta" onclick="app.navigate('terms')">Conditions</button>
    </div>
  </nav>

  <!-- APP CONTAINER -->
  <div id="app">
    <div class="loading">Chargement...</div>
  </div>

  <!-- SCRIPTS -->
  <script src="/app.js"></script>
  <script>
    // Initialiser l'app au chargement
    document.addEventListener('DOMContentLoaded', () => {
      app.init();
      // Gérer les changements de route
      window.addEventListener('popstate', () => {
        app.loadPage();
      });
    });
  </script>
</body>
</html>
