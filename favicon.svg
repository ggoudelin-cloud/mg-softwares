<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16161f"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b5dff"/>
      <stop offset="100%" style="stop-color:#00e5d4"/>
    </linearGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8f230"/>
      <stop offset="100%" style="stop-color:#00e5d4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Border subtle -->
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <!-- MG text -->
  <text x="16" y="22" 
    font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
    font-weight="800" 
    font-size="13" 
    fill="url(#accent)" 
    text-anchor="middle" 
    letter-spacing="-0.5">MG</text>
  <!-- Lime dot accent bottom right -->
  <circle cx="26" cy="26" r="3" fill="url(#dot)"/>
</svg>